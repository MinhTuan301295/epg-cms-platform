services:
  postgres:
    image: postgres:16
    container_name: epg-cms-postgres
    environment:
      POSTGRES_DB: epg_cms
      POSTGRES_USER: epg
      POSTGRES_PASSWORD: epg123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U epg -d epg_cms"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: epg-cms-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: epg-cms-api
    environment:
      NODE_ENV: development
      API_PORT: 3001
      DATABASE_URL: postgresql://epg:epg123@postgres:5432/epg_cms?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: docker-development-secret
      JWT_EXPIRES_IN: 1d
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  admin-web:
    build:
      context: .
      dockerfile: apps/admin-web/Dockerfile
    container_name: epg-cms-admin-web
    environment:
      VITE_API_BASE_URL: http://localhost:3001
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
